name: Build ETF options list

on:
  schedule:
    - cron: "0 5 1 * *"      # 1st of every month, 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance pandas requests

      - name: Build list
        run: python build_etf_options_list.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add symbols_etf_options.txt
          git diff --cached --quiet || (git commit -m "Update optionable ETF list" && git push)
